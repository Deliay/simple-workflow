[project]
name = "simple-workflow"
version = "0.1.0"
description = "A strongly-typed, minimal workflow engine driven by a small pipeline DSL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZeroAsh" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
cache = [
    "boto3>=1.34",
]
dev = [
    "boto3>=1.34",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
simple-workflow = "simple_workflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["simple_workflow"]
mypy_path = "src"

# Use the Tsinghua PyPI mirror by default. Remove this block (or override with
# UV_DEFAULT_INDEX) if you are outside mainland China.
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

